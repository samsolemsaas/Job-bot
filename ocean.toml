[topics.bec]
label = "BEC and payment fraud"
fit = 3
who = "Sales engineer"
angle = "BEC has no malicious link or file to catch. Judge intent: who is asking for money or credentials, and does it fit how this sender normally behaves?"
phrases = ["bec", "business email compromise", "wire fraud", "invoice fraud", "payment fraud",
           "fake invoice", "changed bank details", "bank details", "ach fraud", "ceo fraud",
           "gift card", "payroll diversion", "direct deposit change"]

[topics.ai_phishing]
label = "Targeted phishing getting through"
fit = 3
who = "Research team"
angle = "Pattern matching misses messages written fresh for each target. Investigate every email's context the way an analyst would."
phrases = ["ai phishing", "ai-generated phishing", "ai generated phishing", "llm phishing",
           "phishing got through", "got through", "bypassed", "landed in inbox", "made it to inbox",
           "spear phishing", "targeted phishing", "slipped past", "not caught"]

[topics.trusted_senders]
label = "Compromised vendors and trusted senders"
fit = 3
who = "Research team"
angle = "Trusted infrastructure is the new attack path. A known sender or a real DocuSign link doesn't make an email safe."
phrases = ["vendor email compromise", "compromised vendor", "supplier", "trusted sender",
           "legit domain", "legitimate domain", "compromised mailbox", "compromised partner", "partner account", "docusign", "e-signature",
           "sharepoint link", "onedrive link", "lookalike domain", "typosquat", "spoofed"]

[topics.report_triage]
label = "Phishing reports piling up"
fit = 3
who = "Sales engineer or customer success"
angle = "Every user report deserves an answer. Close the loop with users automatically so the SOC only sees real threats."
phrases = ["phish alert button", "reported phishing", "user reported", "abuse mailbox",
           "phishing reports", "report message", "report phishing", "quarantine release",
           "release requests", "phishing mailbox", "reported emails"]

[topics.seg]
label = "Replacing or adding to the email gateway"
fit = 3
who = "Account executive and sales engineer"
angle = "Run tools side by side on live mail and count what each one misses. Let the results make the case."
phrases = ["secure email gateway", "email gateway", "seg", "mimecast", "proofpoint", "barracuda",
           "defender for office", "mdo", "api-based email security", "replace our email security",
           "email security vendor", "email security solution", "email filtering", "spam filter"]

[topics.false_positives]
label = "False positives and quarantined real email"
fit = 2
who = "Customer success"
angle = "Explain each verdict in plain language so users trust the tool and stop asking for releases."
phrases = ["false positive", "quarantined", "legitimate email", "blocked legit", "missing emails",
           "went to junk", "users complaining"]

[topics.awareness]
label = "Security awareness and phishing tests"
fit = 2
who = "Content team"
angle = "Coaching people on the real email in front of them works better than an annual course."
phrases = ["phishing simulation", "phishing test", "security awareness", "knowbe4", "clicked the link",
           "user training", "awareness training"]

[topics.account_takeover]
label = "Account takeover and MFA bypass"
fit = 2
who = "Research team"
angle = "Email is where most takeovers start. Connect the phishing email to the session it stole."
phrases = ["account takeover", "aitm", "adversary in the middle", "evilginx", "token theft",
           "mfa fatigue", "mfa bypass", "session hijack", "inbox rule", "forwarding rule"]

[topics.deepfakes]
