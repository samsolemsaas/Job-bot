# Lens: Ocean (agentic email security)
# Topics are buyer problems in the category, written in neutral terms.
# fit: 3 = core, 2 = adjacent, 1 = listen only. angle is the point of view to bring.

[company]
name = "Ocean"
category = "Email security"
url = "https://ocean.security/"
aliases = ["ocean security", "ocean.security", "oceansecurity"]

[buyers.leader]
label = "Security leader"
weight = 3
phrases = ["ciso", "as a ciso", "security leader", "head of security", "vp of security",
           "director of security", "my board", "our board", "security budget", "cso"]

[buyers.secops]
label = "SOC & security engineer"
weight = 3
phrases = ["soc", "security engineer", "analyst", "incident response", "triage", "our siem",
           "soar", "playbook", "blue team"]

[buyers.email_admin]
label = "Email & M365 admin"
weight = 3
phrases = ["exchange admin", "m365", "o365", "office 365", "microsoft 365", "google workspace",
           "email admin", "mail flow", "transport rule", "exchange online", "defender for office",
           "our tenant", "sysadmin", "it team", "vp of it"]

[buyers.finance]
label = "Finance & AP"
weight = 2
